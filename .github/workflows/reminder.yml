name: Falench. Ticket Sale Reminder

on:
  schedule:
    - cron: '17,47 * * * *'   # 保険（毎時17分・47分）。GitHubの定期実行は遅れやすいので、本命は cron-job.org からの起動
  workflow_dispatch:
    inputs:
      collect:
        description: '最初に販売情報を取り直す'
        type: boolean
        default: false
      test:
        description: 'テスト通知を1通だけ送る'
        type: boolean
        default: false
      dry_run:
        description: '送信せずログに出すだけ'
        type: boolean
        default: false

# 1つずつ順番に動かす（state.json の取り合い・二重通知を防ぐ）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write   # state.json を保存（push）するため

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 通知時刻まで待つことがあるので長め（上限は6時間）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: Playwrightブラウザのキャッシュ
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Playwrightのインストール
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install chromium --with-deps
          fi

      - name: git の設定
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: リマインダー実行
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          STATE_GIT_PUSH: ${{ inputs.dry_run == true && '0' || '1' }}
          PYTHONUNBUFFERED: '1'
        run: |
          ARGS=""
          if [ "${{ inputs.collect }}" = "true" ]; then ARGS="$ARGS --collect"; fi
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="$ARGS --test"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python reminder.py $ARGS
